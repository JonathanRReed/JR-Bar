[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jrbar"
version = "0.9.3"
description = "Standalone macOS agent monitoring, usage and optional hardware controls."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Kuhar", email = "peter@pkuhar.com" }]
maintainers = [{ name = "Jonathan Reed", email = "Contact@JonathanRReed.com" }]
keywords = ["jrbar", "led", "macbook", "agent", "status", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pyobjc-framework-Cocoa==12.2.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.1; sys_platform == 'darwin'",
    # WebKit also provides the JavaScriptCore bindings led_wasm needs.
    "pyobjc-framework-WebKit==12.2.1; sys_platform == 'darwin'",
    # Calendar alerts ("glow before events start") use EventKit.
    "pyobjc-framework-EventKit==12.2.1; sys_platform == 'darwin'",
    # Native provider secrets stay in macOS Keychain.
    "keyring==25.7.0; sys_platform == 'darwin'",
    # Read Chromium localStorage from an isolated copied LevelDB snapshot.
    "rleveldb==1.0.0; sys_platform == 'darwin'",
    # Preserve comments and formatting while editing Hermes YAML config.
    "ruamel.yaml==0.19.1",
    "hidapi==0.14.0.post4; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/JonathanRReed/JR-Bar"
Repository = "https://github.com/JonathanRReed/JR-Bar"
Issues = "https://github.com/JonathanRReed/JR-Bar/issues"
Upstream = "https://github.com/inteliwear/sidepulse"

[project.optional-dependencies]
# Backwards-compatible alias. Status-bar dependencies install by default.
status-bar = []
test = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "tomli==2.4.1; python_version < '3.11'",
]
dev = [
    "build==1.5.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "setuptools==83.0.0",
    "tomli==2.4.1; python_version < '3.11'",
    "twine==6.2.0",
    "wheel==0.47.0",
]

[project.scripts]
jrbar = "jrbar.cli_entry:jrbar_main"
jrbar-integrations = "jrbar.integration_cli:main"
# Transitional alias for one release: shells and docs that still call
# `sidepulse` keep working while installs are re-pointed at `jrbar`.
sidepulse = "jrbar.cli_entry:jrbar_main"

[tool.setuptools.packages.find]
where = ["src"]
# `sidepulse*` is the import-compat shim (src/sidepulse) that aliases
# `sidepulse.*` -> `jrbar.*` for hook commands registered before the rename.
include = ["jrbar*", "sidepulse*"]

[tool.setuptools.package-data]
"jrbar.resources" = [
    "integration_compatibility.json",
    "provider_fixture_ownership.json",
    "sd_eject_guard.c",
    "sdled.wasm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
# Keep the lint surface deterministic. The retained AppKit controller is frozen
# behind status_bar.py; all new behavior belongs in linted, testable modules.
line-length = 120
extend-exclude = ["src/jrbar/status_bar_legacy.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# En dash / minus sign appear deliberately in user-facing copy.
allowed-confusables = ["\u2013", "\u2212"]
ignore = [
    "RUF046",  # int(len(...)) casts kept for PyObjC bridge clarity
    "RUF059",  # unpacked-but-unused tuple parts document payload shape
    # Raising `requires-python` to 3.12 turns on two pyupgrade rules that
    # would rewrite the whole tree at once. Both are deferred deliberately:
    # UP017 (`timezone.utc` -> `datetime.UTC`) is cosmetic across ~320
    # sites, and UP042 (`(str, Enum)` -> `StrEnum`) changes `str()` and
    # f-string output on ~226 enums, which the wire protocol and the log
    # lines depend on. Every other pyupgrade rule stays enforced.
    "UP017",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# These exceptions document inherited, non-functional ordering debt. They are
# intentionally narrow: undefined-name, syntax, and correctness checks remain
# enabled, and every newly extracted module must pass without exceptions.
"src/jrbar/settings.py" = ["I001"]
"src/jrbar/_settings_legacy.py" = ["I001"]
"src/jrbar/settings_window.py" = ["F821"]
"src/jrbar/usage_card.py" = ["RUF022"]
"src/jrbar/virtual_device.py" = ["I001"]
"tests/test_capacity_authority.py" = ["I001"]
"tests/test_claude_limits_reachable.py" = ["I001"]
"tests/test_first_run_honesty.py" = ["I001"]
"tests/test_hook_import_cost.py" = ["I001"]
"tests/test_screen_bar_colour_matches_hardware.py" = ["I001"]
"tests/test_subagents_are_never_counted.py" = ["F401", "I001", "RUF015"]
"tests/test_usage_cache_bounds.py" = ["I001"]
