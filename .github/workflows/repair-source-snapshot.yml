name: Repair source snapshot
on:
  push:
    branches: [repair/utility-toy-completeness]
    paths: [.github/workflows/repair-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source without credentials or Git metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-source"
          git rev-parse HEAD > "$RUNNER_TEMP/repair-source/COMMIT"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/repair-source/TREE"
          git ls-tree -r HEAD > "$RUNNER_TEMP/repair-source/TRACKED-BLOBS"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/repair-source/source.tar.gz"
          cd "$RUNNER_TEMP/repair-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/repair-source/
          retention-days: 1
          if-no-files-found: error
