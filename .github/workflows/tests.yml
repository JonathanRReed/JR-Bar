name: Tests

# Every push and pull request: the three checks a contributor runs locally
# (make fast, the full pytest suite, swift build && swift test), on a hosted
# macOS 26 runner. Packaging, signing, notarization, hardware and TCC only
# happen on the owner's Mac (docs/PRODUCTION-RELEASE.md).
#
# `macos-latest` is macOS 26 on Apple silicon with Xcode 26, which the Swift
# package needs (`platforms: [.macOS(.v26)]`, swift-tools 6.2). The job ids
# `security` and `macos` are read by tests/test_workflow_contract.py.

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: jrbar-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  security:
    name: Fast gate (make fast)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-constraints.txt
      - name: Bootstrap the pinned development environment
        # bootstrap-dev.sh makes .venv from the interpreter named by PYTHON
        # (it must be 3.12) and installs the checkout with the reviewed
        # constraints; make fast then runs .venv/bin/python.
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: ./scripts/bootstrap-dev.sh
      - name: make fast
        run: make fast

  macos:
    name: Full Python suite
    runs-on: macos-latest
    timeout-minutes: 30
    # Non-blocking until it has gone green on a hosted runner: the suite
    # runs in about five minutes on the owner's Mac, but parts of it touch
    # the Keychain, caffeinate, pmset and the notification centre, which a
    # runner may refuse. Flip this off after the first clean run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release-constraints.txt
      - name: Bootstrap the pinned development environment
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: ./scripts/bootstrap-dev.sh
      - name: pytest tests
        run: .venv/bin/python -m pytest tests -q --durations=25

  swift:
    name: Swift build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The mock daemon the round-trip tests spawn is `python3 scripts/mock-core.py`;
        # put a 3.12 ahead of the system 3.9 on PATH.
        with:
          python-version: "3.12"
      - name: Toolchain
        # The runner has Xcode, so Package.swift takes its plain path (the
        # Command Line Tools-only flags for swift-testing are skipped).
        run: |
          xcode-select -p
          swift --version
          python3 --version
      - name: swift build
        working-directory: app
        run: swift build
      - name: swift test
        # The protocol round trips spawn app/scripts/mock-core.py on a
        # socket of their own; the runner's python3 is enough for it.
        working-directory: app
        run: swift test
