name: Final integration audit
on:
  push:
    branches: [finish/final-integration-2026-09-07]
    paths: [.github/workflows/final-integration-audit.yml]
permissions:
  contents: write
concurrency:
  group: jrbar-final-integration
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'JonathanRReed/JR-Bar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read the exact reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = a581da9cdd0b9628d26b3805b86efe216522ea95
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          shas = ['886f468052e303b446b869776613978c3a9674d9', 'e9776bc1eed9bc10d4b1563637800113f9586cdd', 'a960ce10d8c2b4330fb134a517d251a3246e93a6']
          parts = []
          for sha in shas:
              request = urllib.request.Request('https://api.github.com/repos/JonathanRReed/JR-Bar/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  document = json.load(response)
              raw = base64.b64decode(document['content'])
              assert len(raw) == 9084
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha
              parts.append(raw)
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert len(patch) == 64846
          assert hashlib.sha256(patch).hexdigest() == '7c8781497459c01e7731c3f2e0981875020096dbda59595ff41298794b8e2c72'
          pathlib.Path('/tmp/jrbar-final.patch').write_bytes(patch)
          print('Exact source patch size and SHA-256 verified.')
          PY
      - name: Apply changes and verify source without native tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-integration-audit
          git apply --check /tmp/jrbar-final.patch
          git apply /tmp/jrbar-final.patch
          git add -N src tests docs scripts
          python3 -m pip install --disable-pip-version-check ruff==0.16.3
          git diff --name-only --diff-filter=AM -z -- '*.py' | xargs -0 -r python3 -m ruff check --fix | tee /tmp/final-integration-audit/ruff-fixes.txt
          python3 -m ruff check src tests packaging scripts
          python3 -m compileall -q src tests packaging scripts
          bash -n scripts/final-test.sh scripts/verify.sh
          python3 scripts/verify_dependency_policy.py --root .
          python3 scripts/validate_release_version.py
          python3 scripts/scan_secrets.py --root .
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close final-test integration and control-center lifecycle gaps'
          git push origin HEAD:finish/final-integration-2026-09-07
      - name: Export the source for final comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-integration-audit
          git archive --format=zip HEAD -o /tmp/final-integration-audit/source.zip
          git rev-parse HEAD > /tmp/final-integration-audit/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/final-integration-audit/tree.txt
          git status --porcelain > /tmp/final-integration-audit/status.txt
          git diff --binary > /tmp/final-integration-audit/uncommitted.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-integration-source
          path: /tmp/final-integration-audit/
          retention-days: 3
