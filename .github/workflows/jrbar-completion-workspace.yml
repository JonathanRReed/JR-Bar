name: JR-Bar completion workspace

on:
  push:
    branches: [finish/creator-control-center-2026-09-06]
    paths:
      - .github/workflows/jrbar-completion-workspace.yml
      - .jrbar-completion.patch

permissions:
  contents: write

concurrency:
  group: jrbar-completion-workspace
  cancel-in-progress: false

jobs:
  source-work:
    if: github.repository == 'JonathanRReed/JR-Bar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: finish/creator-control-center-2026-09-06
          fetch-depth: 1
      - name: Assemble exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .jrbar-completion.patch ]; then
            python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('.jrbar-completion.patch').read_text())
          assert manifest['parts'] == 10
          parts = [''.join(pathlib.Path(f'.jrbar-completion.parts/{i:02d}').read_text().split()) for i in range(10)]
          repairs = pathlib.Path('.jrbar-completion-repairs.json')
          if repairs.exists():
              changes = json.loads(repairs.read_text())
              for index in range(10):
                  edits = sorted((e for e in changes if e[0] == index), key=lambda e: e[1], reverse=True)
                  for _, start, end, replacement in edits:
                      parts[index] = parts[index][:start] + replacement + parts[index][end:]
          encoded = ''.join(parts)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(data) == 216900
          assert hashlib.sha256(data).hexdigest() == '43b27cbdc8bef7b6b16e51dd1c50e5b8c4f8b75a59e7972be7b19095de0959a6'
          pathlib.Path('/tmp/jrbar-reviewed.patch').write_bytes(data)
          print('Reviewed patch byte count and SHA-256 verified.')
          PY
          fi
      - name: Apply source changes and static checks only
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/jrbar-reviewed.patch ]; then
            git apply --check /tmp/jrbar-reviewed.patch
            git apply /tmp/jrbar-reviewed.patch
            python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_deck_control_center_contracts.py')
          old = '    board.update([a]); board.toggle_pin(0); board.update([]); board.clear_inactive()'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, '    board.update([a])\n    board.toggle_pin(0)\n    board.update([])\n    board.clear_inactive()'))
          PY
            git add -N src tests docs README.md CHANGELOG.md pyproject.toml
            python3 -m pip install --disable-pip-version-check ruff==0.16.3
            git diff --name-only --diff-filter=ACM -z -- 'src/*.py' 'tests/*.py' | xargs -0 -r python3 -m ruff check --fix
            python3 -m compileall -q src tests
            git diff --check
            rm .jrbar-completion.patch
            rm -rf .jrbar-completion.parts
            rm -f .jrbar-completion-repairs.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'feat: finish Creator Micro control-center source integration'
            git push origin HEAD:finish/creator-control-center-2026-09-06
          fi
      - name: Export tracked source and static-review diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jrbar-export
          git archive --format=zip HEAD -o /tmp/jrbar-export/source.zip
          git rev-parse HEAD > /tmp/jrbar-export/commit.txt
          git status --porcelain > /tmp/jrbar-export/status.txt
          git diff --binary > /tmp/jrbar-export/static-review.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: jrbar-completion-source
          path: /tmp/jrbar-export/
          retention-days: 1
